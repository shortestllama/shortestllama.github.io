---
layout: default
---
<h1>{{ page.title }}</h1>

<span>{{ page.source }}</span> <b>·</b>
<span>{{ page.date | date_to_string }}</span> <b>·</b>

{% capture t %}{{ content | reading_time }}{% endcapture %}
<span class="reading-time">{{ t }} {{ t == '1' ? 'min' : 'mins' }} read</span>
<!-- <span>{{ page.read_time }}</span> -->

{{ content }}
